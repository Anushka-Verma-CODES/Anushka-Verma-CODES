name: Night Watch snake

on:
  schedule:
    - cron: "0 0 * * *"   # every midnight, like a proper night watch
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#4a2c5e&color_dots=#ebedf0,#e7defa,#b9a7ff,#8b6fd6,#4a2c5e
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd27a&color_dots=#1f1a45,#3b2f7a,#7a5cc7,#f7a8c4,#ffd9a0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
