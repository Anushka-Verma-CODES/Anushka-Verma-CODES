<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1d1b4b"/>
      <stop offset="1" stop-color="#4a2c5e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.5" stop-color="#f7a8c4"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
    <style>
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
      @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

      .win { fill: #ffcf6e; animation: flicker 6s steps(1) infinite; }
      .w2 { animation-delay: 1.3s; } .w3 { animation-delay: 2.9s; } .w4 { animation-delay: 4.1s; }
      @keyframes flicker { 0%,100% { opacity: 1 } 40% { opacity: .95 } 42% { opacity: .35 } 46% { opacity: 1 } }

      .fly { fill: #fff3a6; animation: drift 9s ease-in-out infinite, glow 2.2s ease-in-out infinite; }
      .f2 { animation-delay: -3s, -.6s; } .f3 { animation-delay: -6s, -1.2s; } .f4 { animation-delay: -1.5s, -1.7s; }
      @keyframes drift { 0%,100% { transform: translate(0,0) } 25% { transform: translate(18px,-14px) } 50% { transform: translate(-6px,-26px) } 75% { transform: translate(-16px,-8px) } }
      @keyframes glow { 0%,100% { opacity: .15 } 50% { opacity: 1 } }

      .smoke { fill: #c9c3e6; opacity: 0; animation: rise 5s ease-out infinite; }
      .k2 { animation-delay: 1.6s; } .k3 { animation-delay: 3.2s; }
      @keyframes rise { 0% { opacity: 0; transform: translate(0,0) scale(.6) } 20% { opacity: .35 } 100% { opacity: 0; transform: translate(14px,-46px) scale(1.6) } }

      .shoot { stroke: #fff; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: shoot 7s ease-in infinite; animation-delay: 2s; }
      @keyframes shoot { 0% { opacity: 0; transform: translate(0,0) } 2% { opacity: 1 } 9% { opacity: 0; transform: translate(-260px,130px) } 100% { opacity: 0; transform: translate(-260px,130px) } }

      .fade { opacity: 0; animation: up 1.2s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.2s }
      @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="80" cy="50" r="1.4"/><circle class="star s2" cx="160" cy="110" r="1"/>
    <circle class="star s3" cx="240" cy="40" r="1.6"/><circle class="star s4" cx="330" cy="90" r="1"/>
    <circle class="star s2" cx="420" cy="30" r="1.2"/><circle class="star" cx="510" cy="70" r="1"/>
    <circle class="star s3" cx="690" cy="45" r="1.3"/><circle class="star s4" cx="770" cy="105" r="1"/>
    <circle class="star" cx="850" cy="25" r="1.5"/><circle class="star s2" cx="1010" cy="140" r="1"/>
    <circle class="star s3" cx="1120" cy="60" r="1.4"/><circle class="star s4" cx="1170" cy="130" r="1"/>
    <circle class="star" cx="40" cy="150" r="1"/><circle class="star s2" cx="600" cy="120" r="1"/>
    <circle class="star s4" cx="940" cy="80" r="1.1"/>
  </g>
  <line class="shoot" x1="1000" y1="40" x2="1040" y2="20"/>

  <!-- moon -->
  <circle cx="1040" cy="95" r="90" fill="url(#moonGlow)"/>
  <circle cx="1040" cy="95" r="34" fill="#fff1cf"/>
  <circle cx="1054" cy="86" r="32" fill="#1a1a45" opacity=".9"/>

  <!-- far hills -->
  <path d="M0 300 C 150 250 300 270 450 285 S 750 240 900 270 S 1100 255 1200 270 V400 H0Z" fill="#2c2457"/>
  <!-- near hill -->
  <path d="M0 340 C 200 300 380 330 560 320 S 900 290 1200 330 V400 H0Z" fill="#191537"/>

  <!-- village (right side) -->
  <g transform="translate(760,235)">
    <!-- house 1 -->
    <rect x="0" y="40" width="70" height="55" fill="#120f2a"/>
    <path d="M-8 42 L35 8 L78 42Z" fill="#0d0b20"/>
    <rect class="win" x="12" y="55" width="14" height="14" rx="2"/>
    <rect class="win w2" x="44" y="55" width="14" height="14" rx="2"/>
    <rect x="52" y="12" width="10" height="22" fill="#0d0b20"/>
    <circle class="smoke" cx="57" cy="8" r="6"/><circle class="smoke k2" cx="57" cy="8" r="6"/><circle class="smoke k3" cx="57" cy="8" r="6"/>
    <!-- tower -->
    <rect x="100" y="0" width="40" height="95" fill="#100d25"/>
    <path d="M94 2 L120 -36 L146 2Z" fill="#0b0a1d"/>
    <rect class="win w3" x="113" y="20" width="14" height="20" rx="7"/>
    <rect class="win" x="113" y="55" width="14" height="14" rx="2"/>
    <!-- house 2 -->
    <rect x="170" y="50" width="90" height="45" fill="#120f2a"/>
    <path d="M162 52 L215 18 L268 52Z" fill="#0d0b20"/>
    <rect class="win w4" x="184" y="62" width="14" height="14" rx="2"/>
    <rect class="win w2" x="232" y="62" width="14" height="14" rx="2"/>
    <rect x="207" y="70" width="16" height="25" fill="#2a1f12"/>
    <!-- lamp post -->
    <rect x="296" y="30" width="4" height="65" fill="#0b0a1d"/>
    <circle cx="298" cy="28" r="22" fill="url(#lamp)"/>
    <circle cx="298" cy="28" r="5" fill="#ffe2a0"/>
    <!-- pine trees -->
    <path d="M330 95 L350 20 L370 95Z" fill="#0c1a1f"/>
    <path d="M365 95 L382 40 L399 95Z" fill="#0a1519"/>
  </g>

  <!-- fireflies -->
  <circle class="fly" cx="700" cy="320" r="2.5"/>
  <circle class="fly f2" cx="820" cy="350" r="2"/>
  <circle class="fly f3" cx="1110" cy="330" r="2.5"/>
  <circle class="fly f4" cx="620" cy="355" r="2"/>
  <circle class="fly f2" cx="980" cy="360" r="2"/>

  <!-- text -->
  <text class="fade d1" x="70" y="150" fill="#b9a7ff" font-size="18" letter-spacing="6" font-family="Consolas, 'Courier New', monospace">HELLO, TRAVELLER — WELCOME TO</text>
  <text class="fade d2" x="66" y="222" fill="url(#nameGrad)" font-size="74" font-weight="700" letter-spacing="1">Anushka's Village</text>
  <text class="fade d3" x="70" y="268" fill="#e7defa" font-size="20" opacity=".9">where every house is a project and the lights stay on late ✦</text>
</svg>
