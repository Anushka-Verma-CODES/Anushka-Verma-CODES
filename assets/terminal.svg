<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="15">
  <defs>
    <style>
      .line { opacity: 0; animation: show .01s linear forwards; }
      @keyframes show { to { opacity: 1 } }
      .cursor { fill: #f7a8c4; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .p { fill: #b9a7ff } .c { fill: #ffd9a0 } .k { fill: #8be9c4 } .t { fill: #e7defa } .m { fill: #8c84b5 }
    </style>
  </defs>

  <rect width="820" height="340" rx="14" fill="#14112e"/>
  <rect width="820" height="38" rx="14" fill="#1f1a45"/>
  <rect y="24" width="820" height="14" fill="#1f1a45"/>
  <circle cx="24" cy="19" r="6" fill="#ff7a90"/><circle cx="46" cy="19" r="6" fill="#ffd27a"/><circle cx="68" cy="19" r="6" fill="#8be9c4"/>
  <text x="410" y="24" text-anchor="middle" class="m" font-size="13">anushka@village: ~</text>

  <g transform="translate(28,72)">
    <g class="line" style="animation-delay:.3s"><text><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="t">whoami</tspan></text></g>
    <g class="line" style="animation-delay:1s"><text y="24" class="k">Anushka Verma · CSE @ TIET Patiala · builder of small worlds</text></g>

    <g class="line" style="animation-delay:1.8s"><text y="60"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="t">cat interests.txt</tspan></text></g>
    <g class="line" style="animation-delay:2.5s"><text y="84" class="t">  ◆ multi-object tracking — eyes that never lose you</text></g>
    <g class="line" style="animation-delay:2.8s"><text y="106" class="t">  ◆ UAV swarms            — reading intent from flight</text></g>
    <g class="line" style="animation-delay:3.1s"><text y="128" class="t">  ◆ distributed systems   — making nodes agree (Raft)</text></g>
    <g class="line" style="animation-delay:3.4s"><text y="150" class="t">  ◆ 3D web                — portfolios you can walk in</text></g>

    <g class="line" style="animation-delay:4.2s"><text y="186"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="t">uptime</tspan></text></g>
    <g class="line" style="animation-delay:4.9s"><text y="210" class="m">  research → build → learn → repeat</text></g>

    <g class="line" style="animation-delay:5.6s"><text y="246"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan></text><rect class="cursor" x="40" y="233" width="9" height="17"/></g>
  </g>
</svg>
